<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dizipaytitlelogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Dizipay Wallet | Secure Payments</title>
    
    <!-- Speed up connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme") || "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const resolved = stored === "system" ? (prefersDark ? "dark" : "light") : stored;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.classList.toggle("light", resolved !== "dark");
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    
    <!-- Preload critical assets -->
    <link rel="modulepreload" href="/src/main">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main"></script>
  </body>
</html>
